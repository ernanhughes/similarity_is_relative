[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "similarity-is-relative"
version = "0.1.0"
description = "Evidence-first research into relation-specific retrieval over frozen representations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
option-b = [
  "torch>=2.4",
  "transformers>=4.45",
  "tokenizers>=0.20",
  "datasets>=3.0",
  "huggingface-hub>=0.25",
]

[project.scripts]
relate-e00 = "relate.experiments.e00:main"
relate-verify-e00 = "relate.verification.e00:main"
relate-finalize-e00 = "relate.publication.e00:main"
relate-e00-operators = "relate.experiments.e00_operator_matrix:main"
relate-verify-e00-operators = "relate.verification.e00_operator_matrix:main"
relate-e00-certify = "relate.experiments.e00_certification:main"
relate-verify-e00-certification = "relate.verification.e00_certification:main"
relate-e00-multiseed = "relate.experiments.e00_multiseed:main"
relate-verify-e00-multiseed = "relate.verification.e00_multiseed:main"
relate-e01-compose = "relate.experiments.e01_composition:main"
relate-verify-e01-compose = "relate.verification.e01_composition:main"
relate-e01-relational = "relate.experiments.e01_relational_conjunction:main"
relate-verify-e01-relational = "relate.verification.e01_relational_conjunction:main"
relate-e01-multiseed = "relate.experiments.e01_multiseed_composition:main"
relate-verify-e01-multiseed = "relate.verification.e01_multiseed_composition:main"
relate-audit-e01 = "relate.audits.e01_independent_recomputation:main"
relate-option-b = "relate.experiments.option_b_real_code:main"
relate-option-b-freeze = "relate.experiments.option_b_identity:main"
relate-option-b-freeze-v2 = "relate.experiments.option_b_identity_v2:main"
relate-option-b-select = "relate.experiments.option_b_selection_resilient:main"
relate-option-b-embed = "relate.experiments.option_b_embeddings_hardened:main"
relate-option-b-embed-preflight = "relate.experiments.option_b_embedding_preflight:main"
relate-option-b-verify-embeddings = "relate.experiments.option_b_embedding_reproduction:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/relate/experiments/e00_multiseed.py" = ["B008"]
