[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "similarity-is-relative"
version = "0.1.0"
description = "Evidence-first research into relation-specific retrieval over frozen representations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
relate-e00 = "relate.experiments.e00:main"
relate-verify-e00 = "relate.verification.e00:main"
relate-finalize-e00 = "relate.publication.e00:main"
relate-e00-operators = "relate.experiments.e00_operator_matrix:main"
relate-verify-e00-operators = "relate.verification.e00_operator_matrix:main"
relate-e00-certify = "relate.experiments.e00_certification:main"
relate-verify-e00-certification = "relate.verification.e00_certification:main"
relate-e00-multiseed = "relate.experiments.e00_multiseed:main"
relate-verify-e00-multiseed = "relate.verification.e00_multiseed:main"
relate-e01-compose = "relate.experiments.e01_composition:main"
relate-verify-e01-compose = "relate.verification.e01_composition:main"
relate-e01-relational = "relate.experiments.e01_relational_conjunction:main"
relate-verify-e01-relational = "relate.verification.e01_relational_conjunction:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/relate/experiments/e00_multiseed.py" = ["B008"]
